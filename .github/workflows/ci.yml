name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Create smoke-test image
        run: |
          echo "dummy" > test.jpg

      - name: Start server
        run: |
          CI=true PORT=3001 npm start &
          sleep 5

      - name: Health check
        run: |
          curl -f http://localhost:3001/

      - name: Test upload endpoint
        run: |
          curl -f -X POST http://localhost:3001/upload -F "image=@test.jpg"
