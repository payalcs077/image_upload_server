name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - run: npm ci

      - name: Create test image
        run: |
          echo "dummy" > test.jpg

      - name: Start server
        run: |
          PORT=3001 node server.js &
          sleep 5

      - name: Health check
        run: |
          curl -f http://localhost:3001/

      - name: Test upload endpoint
        run: |
          curl -f -X POST http://localhost:3001/upload -F "image=@test.jpg"